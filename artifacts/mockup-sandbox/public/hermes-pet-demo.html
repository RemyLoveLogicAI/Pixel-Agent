    const DEFAULT_TIMING = {

      alert: { frameDuration: 180, loop: true },

","CCCCCDDBBDDCCCCC","CCCCFFCCCCFFCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"],["CCCCCCCCCCCCCCCC","CCCCAACCCCAACCCC","CCCCCACCCCACCCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBBBBBBBBBBBCC","CCBBDDDBBDDDBBCC","CCBBBKBBBBKBBBCC","CCCBBBMMMMBBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCFFCCCCFFCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"],["CCCCAACCCCAACCCC","CCCCCACCCCACCCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBBBBBBBBBBBCC","CCBBDDDBBDDDBBCC","CCBBBKBBBBKBBBCC","CCCBBBMMMMBBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCFFCCCCFFCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"]],"happy":[["CCCCAACCCCAACCCC","CCCCCACCCCACCCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBESEBBESEBBCC","CCBBBKBBBBKBBBCC","CCCBBMMMMMMBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCFFCCCCFFCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"],["CCCAACCCCCCAACCC","CCCCACCCCCCACCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBESEBBESEBBCC","CCBBBKBBBBKBBBCC","CCCBBMMMMMMBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCCFCCCCFCCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"],["CCCCAACCCCAACCCC","CCCCCACCCCACCCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBESEBBESEBBCC","CCBBBKBBBBKBBBCC","CCCBBMMMMMMBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCFFCCCCCCFFCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"]],"lookLeft":[["CCCCAACCCCAACCCC","CCCCCACCCCACCCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBSEEBBSEEBBCC","CCBBBKBBBBKBBBCC","CCCBBBMMMMBBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCFFCCCCFFCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"],["CCCAACCCCCCAACCC","CCCCACCCCCCACCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBSEEBBSEEBBCC","CCBBBKBBBBKBBBCC","CCCBBBMMMMBBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCFFCCCCFFCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"]],"lookRight":[["CCCCAACCCCAACCCC","CCCCCACCCCACCCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBEESBBEESBBCC","CCBBBKBBBBKBBBCC","CCCBBBMMMMBBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCFFCCCCFFCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"],["CCCAACCCCCCAACCC","CCCCACCCCCCACCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBEESBBEESBBCC","CCBBBKBBBBKBBBCC","CCCBBBMMMMBBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCFFCCCCFFCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"]],"jump":[["CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC","CCCCCACCCCACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBESEBBESEBBCC","CCBBBKBBBBKBBBCC","CCCBBBMMMMBBBCCC","CCBBBBBBBBBBBBCC","CCCBBBBBBBBBBCCC","CCCCCDDBBDDCCCCC","CCCFFCCCCCCFFCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"],["CCCAACCCCCCAACCC","CCCCACCCCCCACCCC","CCCCCABBBBACCCCC","CCCCBBBBBBBBCCCC","CCCBBBBBBBBBBCCC","CCBBBBBBBBBBBBCC","CCBBEEEBBEEEBBCC","CCBBESEBBESEBBCC","CCBBBKBBBBKBBBCC","CCCBBBMMMMBBBCCC","CCCBBBBBBBBBBCCC","CCCCBBBBBBBBCCCC","CCCCCDDBBDDCCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC","CCCCCCCCCCCCCCCC"]]}};

    // ── Scenarios ──────────────────────────────────────────────────────────────
    const SCENARIOS = {
      build: { label: "Build Mode", state: "talking", district: "The Hearthworks", scene: "build" },
      alert: { label: "Raise Alert", state: "alert", district: "The Thresholds", scene: "alert" },
      happy: { label: "Deliver", state: "happy", district: "Courier Lanes", scene: "deliver" },
      sleep: { label: "Cool Down", state: "sleeping", district: "Repair Yard", scene: "rest" },
      inspect: { label: "Inspect", state: "lookLeft", district: "The Stacks", scene: "inspect" },
    };

    // ── PetCanvas component ────────────────────────────────────────────────────
    function PetCanvas({ pet, state = "idle", size = 256 }) {
      const canvasRef = useRef(null);
      const frameRef = React.useRef(0);
      const lastTimeRef = React.useRef(0);
      const sparkleRef = React.useRef({ x: 0, y: 0 });

      const drawFrame = React.useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas || !pet) return;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        const frames = pet.frames[state] || pet.frames.idle;
        if (!frames?.length) return;
        const frame = frames[Math.min(frameRef.current, frames.length - 1)];
        ctx.clearRect(0, 0, 16, 16);
        for (let r = 0; r < 16; r++) {
          for (let c = 0; c < 16; c++) {
            let ch = frame[r][c];
            if (ch === "C") continue;
            const slot = CHAR_MAP[ch];
            if (!slot) continue;
            ctx.fillStyle = pet.palette[slot];
            ctx.fillRect(c, r, 1, 1);
          }
        }
      }, [pet, state]);

      React.useEffect(() => {
        frameRef.current = 0;
        lastTimeRef.current = 0;
      }, [pet, state]);

      React.useEffect(() => {
        let id;
        const loop = (ts) => {
          if (!pet) return;
          if (!lastTimeRef.current) lastTimeRef.current = ts;
          const frames = pet.frames[state] || pet.frames.idle;
          const timing = DEFAULT_TIMING[state] || DEFAULT_TIMING.idle;
          if (ts - lastTimeRef.current >= timing.frameDuration) {
            if (frameRef.current < frames.length - 1) frameRef.current++;
            else if (timing.loop) frameRef.current = 0;
            lastTimeRef.current = ts;
          }
          drawFrame();
          id = requestAnimationFrame(loop);
        };
        id = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(id);
      }, [pet, state, drawFrame]);

      return React.createElement("canvas", {
        ref: canvasRef, width: 16, height: 16,
        style: { width: size, height: size, imageRendering: "pixelated" },
      });
    }

    // ── App ────────────────────────────────────────────────────────────────────
    function App() {
      const [scenario, setScenario] = useState("build");
      const s = SCENARIOS[scenario];

      return React.createElement("div", { className: "min-h-screen bg-gray-950 text-white p-8" },
        React.createElement("div", { className: "max-w-4xl mx-auto" },
          React.createElement("h1", { className: "text-3xl font-bold mb-6" }, "Hermes PetCanvas Demo"),
          React.createElement("div", { className: "flex gap-2 mb-8 flex-wrap" },
            Object.entries(SCENARIOS).map(([key, val]) =>
              React.createElement("button", {
                key: key,
                onClick: () => setScenario(key),
                className: `px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                  key === scenario ? "bg-indigo-600" : "bg-gray-800 hover:bg-gray-700"
                }`
              }, val.label)
            )
          ),
          React.createElement("div", { className: "bg-gray-900 rounded-2xl p-8 text-center" },
            React.createElement("div", { className: "text-xs text-gray-500 mb-2" },
              `District: ${s.district}  |  State: ${s.state}  |  Scene: ${s.scene}`
            ),
            React.createElement(PetCanvas, { pet: FRYGAR, state: s.state, size: 256 }),
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
